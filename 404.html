<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>نقاء · توجيه</title>
<script>
(function () {
  try {
    var path = location.pathname || "";
    var parts = path.split("/").filter(Boolean);
    /* /naqa-om/SKU/ or /SKU/ → /naqa-om/barcode/SKU/ */
    var base = "";
    var i = parts.indexOf("naqa-om");
    if (i >= 0) {
      base = "/" + parts.slice(0, i + 1).join("/");
      parts = parts.slice(i + 1);
    }
    if (parts[0] === "barcode" || parts[0] === "p" || parts[0] === "media" || parts[0] === "js" || parts[0] === "css" || parts[0] === "data" || parts[0] === "docs") {
      location.replace(base + "/");
      return;
    }
    if (parts.length >= 1) {
      var slug = parts[0];
      if (/^[0-9]{6,}$/.test(slug) || /^[A-Za-z0-9][A-Za-z0-9._-]{3,}$/.test(slug)) {
        location.replace(base + "/barcode/" + encodeURIComponent(slug) + "/");
        return;
      }
    }
    location.replace(base + "/");
  } catch (e) {
    location.replace("/");
  }
})();
</script>
</head>
<body style="font-family:system-ui;padding:24px;text-align:center">
  <p>جاري التوجيه… <a href="./">المتجر</a></p>
</body>
</html>
