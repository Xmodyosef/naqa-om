<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>تجربة 07 — آباء فوق + ورقة أبناء (موبايل)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f6f0ed;color:#1f1a17;direction:rtl}
.wrap{max-width:980px;margin:0 auto;padding:12px}
.tag{display:inline-block;font-size:.7rem;font-weight:800;color:#8d3048;background:#f3e4e8;padding:4px 10px;border-radius:999px;margin-bottom:10px}
h1{font-size:1.05rem;margin:0 0 6px}
.note{color:#7a6a65;font-size:.82rem;margin:0 0 16px;line-height:1.5}
.demo{background:#fff;border:1px solid #eadfd9;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(40,20,24,.06)}
.main{padding:16px;min-height:220px}
.main h2{margin:0 0 8px;font-size:1rem}
.main p{margin:0;color:#7a6a65;font-size:.85rem;line-height:1.55}
.ph{height:10px;background:#f0e6e2;border-radius:6px;margin:10px 0}
.ph.w2{width:70%}.ph.w3{width:45%}
.card{background:#faf6f4;border:1px solid #eadfd9;border-radius:12px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">تجربة 07 · معاينة فقط · اللوحة الأصلية ما تغيّرت</span>
  <h1>آباء فوق + ورقة أبناء (موبايل)</h1>
  <p class="note">اضغطي طلبات/منتجات → تطلع ورقة من تحت فيها الأبناء فقط. باقي الأقسام بدون ورقة.<br>اضغطي الآباء والأبناء للتجربة. اختاري الرقم اللي يعجبك.</p>
  
<style>
.nav-p{display:flex;gap:6px;padding:12px;overflow-x:auto;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid #eadfd9}
.pbtn{border:1px solid #eadfd9;background:#fff;padding:10px 14px;border-radius:12px;font:800 .78rem inherit;cursor:pointer;white-space:nowrap}
.pbtn.on{border-color:#c46b7c;background:#c46b7c;color:#fff}
.sheet-bg{display:none;position:fixed;inset:0;background:rgba(20,10,12,.45);z-index:20;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px;padding-bottom:28px}
.sheet h3{margin:0 0 12px;font-size:.95rem}
.sheet .row{display:flex;flex-direction:column;gap:8px}
.sheet button{border:1px solid #eadfd9;background:#faf6f4;padding:14px;border-radius:12px;font:800 .85rem inherit;text-align:start;cursor:pointer}
.sheet button.on{border-color:#c46b7c;background:#fdf0f3;color:#8d3048}
.handle{width:40px;height:4px;background:#e0d4d0;border-radius:4px;margin:0 auto 12px}
</style>
<div class="demo" style="position:relative;min-height:360px">
  <div class="nav-p" id="parents"></div>
  <div class="main"><h2 id="t">—</h2><p id="dscr"></p><div class="card">المحتوى</div></div>
  <div class="sheet-bg" id="sheet">
    <div class="sheet">
      <div class="handle"></div>
      <h3 id="shTitle">اخترِ</h3>
      <div class="row" id="children"></div>
      <button type="button" id="closeSheet" style="margin-top:12px;width:100%;border:0;background:#efe6e2;padding:12px;border-radius:12px;font:800 .85rem inherit">إغلاق</button>
    </div>
  </div>
</div>
<script>
const tabs={home:{l:'الرئيسية'},orders:{l:'الطلبات',c:[['all','الكل'],['new','جديد'],['prep','تجهيز'],['ship','توصيل'],['done','تم'],['cancel','ملغي']]},products:{l:'المنتجات',c:[['all','الكل'],['shown','ظاهر'],['hidden','مخفي']]},reviews:{l:'التقييمات'},customers:{l:'العملاء'},finance:{l:'المالية'},settings:{l:'الإعدادات'}};
let cur='home',sub=null;
const P=document.getElementById('parents'),C=document.getElementById('children'),S=document.getElementById('sheet');
function paint(){
  P.innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="pbtn ${k===cur?'on':''}" data-k="${k}">${v.l}</button>`).join('');
  document.getElementById('t').textContent=tabs[cur].l+(sub?' · '+sub:'');
  document.getElementById('dscr').textContent='للأقسام اللي فيها أبناء: ورقة منفصلة. الأب ما ينفتح جواه ابن.';
}
P.onclick=e=>{
  const b=e.target.closest('[data-k]');if(!b)return;
  cur=b.dataset.k;const t=tabs[cur];
  if(t.c){
    document.getElementById('shTitle').textContent=t.l;
    C.innerHTML=t.c.map(([id,l])=>`<button type="button" class="${sub===id?'on':''}" data-s="${id}">${l}</button>`).join('');
    S.classList.add('show');
  } else {sub=null;S.classList.remove('show');}
  paint();
};
C.onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;sub=b.dataset.s;S.classList.remove('show');paint()};
document.getElementById('closeSheet').onclick=()=>S.classList.remove('show');
S.onclick=e=>{if(e.target===S)S.classList.remove('show')};
paint();
</script>

  <p class="note" style="margin-top:16px"><a href="nav-experiments.html">← كل التجارب</a></p>
</div>
</body>
</html>
