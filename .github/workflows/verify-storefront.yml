name: Verify and build storefront
on:
  pull_request:
    branches: [main]
    paths:
      - "js/app.js"
      - "js/core.js"
      - "js/cart.js"
      - "js/render/**"
      - "js/features/**"
      - "js/admin/**"
      - "css/store/**"
      - "scripts/build-store.sh"
      - "scripts/verify-fixes.js"
      - ".github/workflows/verify-storefront.yml"
permissions:
  contents: write
  pull-requests: read
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build storefront assets without regenerating SEO pages
        run: NAQA_SKIP_SEO_BUILD=1 bash scripts/build-store.sh
      - name: Verify generated bundles and admin behavior
        run: node scripts/verify-fixes.js
      - name: Check whitespace errors
        run: git diff --check
      - name: Commit generated storefront bundles to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/store.min.js css/store.min.css
          if ! git diff --cached --quiet; then
            git commit -m "build(store): refresh generated storefront bundles"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
