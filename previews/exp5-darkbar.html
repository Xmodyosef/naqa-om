<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>تجربة 5 — شريطين داكنين</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body{background:#f5eeea;color:#1f1a17;direction:rtl}
.wrap{max-width:980px;margin:0 auto;padding:14px 12px 40px}
.brand{font-weight:900;font-size:.95rem;margin-bottom:10px;color:#8d3048}
.hint{font-size:.78rem;color:#7a6a66;margin-bottom:14px;line-height:1.5}
.demo-frame{background:#fff;border:1px solid #eadfd9;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(40,20,20,.06)}
.demo-head{padding:10px 14px;background:#2a1a1e;color:#f5eeea;font-size:.8rem;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.demo-body{padding:12px;min-height:320px}
.parents{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pbtn{border:1px solid #eadfd9;background:#fff;color:#3a2a28;padding:10px 14px;border-radius:12px;font:800 .8rem/1 inherit;cursor:pointer;transition:.15s}
.pbtn:hover{border-color:#c46b7c;color:#8d3048}
.pbtn.on{background:#c46b7c;border-color:#c46b7c;color:#fff;box-shadow:0 3px 10px rgba(196,107,124,.35)}
.children{display:none;gap:8px;flex-wrap:wrap;padding:10px;background:#faf6f4;border:1px dashed #e7d8d2;border-radius:12px;margin-bottom:12px}
.children.show{display:flex}
.cbtn{border:0;background:#fff;border:1px solid #eadfd9;padding:8px 12px;border-radius:999px;font:700 .75rem inherit;cursor:pointer;color:#4a3a36}
.cbtn.on{background:#8d3048;color:#fff;border-color:#8d3048}
.content{padding:14px;background:#fff;border:1px solid #f0e6e2;border-radius:12px;font-size:.85rem;color:#5a4a46;min-height:120px}
.tag{display:inline-block;background:#f3e4e7;color:#8d3048;font-size:.65rem;font-weight:800;padding:2px 8px;border-radius:999px;margin-inline-start:6px}

.demo-body{padding:0}
.bar-parents{background:#2a1a1e;padding:10px 10px 8px;display:flex;flex-wrap:wrap;gap:6px}
.bar-parents .pbtn{background:#3d2a2e;border-color:#3d2a2e;color:#e8dcd9}
.bar-parents .pbtn.on{background:#c46b7c;border-color:#c46b7c;color:#fff}
.bar-kids{min-height:48px;padding:8px 10px;background:#1f1215;display:none;flex-wrap:wrap;gap:6px;align-items:center}
.bar-kids.show{display:flex}
.bar-kids .cbtn{background:#2a1a1e;border-color:#3d2a2e;color:#e0d4d0}
.bar-kids .cbtn.on{background:#c46b7c;border-color:#c46b7c;color:#fff}
.panel{padding:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">نقاء · تجارب تنقل (لا تلمس اللوحة الحقيقية)</div>
  <p class="hint"><b>تجربة 5:</b> شريط آباء داكن ثابت فوق. شريط أبناء داكن ثاني يظهر فقط عند الطلبات/المنتجات. المحتوى أبيض تحت.<br>اضغطي الآباء فوق — الأبناء يطلعون <b>منفصلين</b> تحتهم (مو مع الأب في نفس الزر).</p>
  <div class="demo-frame">
    <div class="demo-head"><span>معاينة 5</span><span style="opacity:.7">نقاء</span></div>
    <div class="demo-body">

      <div class="bar-parents parents" id="parents">
        <button class="pbtn" data-p="home">الرئيسية</button>
        <button class="pbtn" data-p="orders">الطلبات</button>
        <button class="pbtn" data-p="products">المنتجات</button>
        <button class="pbtn" data-p="reviews">التقييمات</button>
        <button class="pbtn" data-p="customers">العملاء</button>
        <button class="pbtn" data-p="finance">المالية</button>
        <button class="pbtn" data-p="settings">الإعدادات</button>
      </div>
      <div class="bar-kids children" id="kids"></div>
      <div class="panel content" id="content"></div>

    </div>
  </div>
  <p class="hint" style="margin-top:16px">ارجعي للـ index واخترِ الرقم اللي يناسبك.</p>
</div>
<script>
const DATA={
  home:{label:'الرئيسية',kids:[]},
  orders:{label:'الطلبات',kids:[['all','الكل'],['new','جديد'],['prep','تجهيز'],['ship','توصيل'],['delivered','تم'],['cancel','ملغي']]},
  products:{label:'المنتجات',kids:[['all','الكل'],['shown','ظاهر'],['hidden','مخفي']]},
  reviews:{label:'التقييمات',kids:[]},
  customers:{label:'العملاء',kids:[]},
  finance:{label:'المالية',kids:[]},
  settings:{label:'الإعدادات',kids:[]}
};
let tab='home', sub=null;
function paint(){
  document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on', b.dataset.p===tab));
  const box=document.getElementById('kids');
  const kids=DATA[tab].kids;
  if(!kids.length){ box.classList.remove('show'); box.innerHTML=''; }
  else {
    box.classList.add('show');
    box.innerHTML=kids.map(([id,l])=>`<button type="button" class="cbtn${sub===id?' on':''}" data-c="${id}">${l}</button>`).join('');
  }
  const c=document.getElementById('content');
  c.innerHTML='<b>'+DATA[tab].label+'</b>'+(sub?' · '+ (kids.find(k=>k[0]===sub)||[])[1] :'')+'<br><br>هنا محتوى القسم — مو أزرار. الأبناء فوق منفصلين.';
}
document.getElementById('parents').addEventListener('click',e=>{
  const b=e.target.closest('[data-p]'); if(!b) return;
  tab=b.dataset.p; sub=DATA[tab].kids[0]?DATA[tab].kids[0][0]:null; paint();
});
document.getElementById('kids').addEventListener('click',e=>{
  const b=e.target.closest('[data-c]'); if(!b) return;
  sub=b.dataset.c; paint();
});
paint();
</script>
</body></html>
