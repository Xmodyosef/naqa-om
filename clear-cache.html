<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>مسح كاش نقاء</title>
</head>
<body style="font-family:system-ui,sans-serif;max-width:420px;margin:40px auto;padding:16px;background:#fdf8f6;color:#1f1a17;line-height:1.6">
  <h1 style="font-size:1.1rem;color:#8d3048">مسح الكاش القديم</h1>
  <p id="msg">جاري مسح Service Worker والكاش…</p>
  <p><a id="go" href="admin.html?v=20261125purge2" style="color:#8d3048;font-weight:800">افتحي اللوحة</a></p>
  <script>
  (async function () {
    var msg = document.getElementById("msg");
    try {
      if ("serviceWorker" in navigator) {
        var regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(function (r) { return r.unregister(); }));
      }
      if (window.caches) {
        var keys = await caches.keys();
        await Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }
      try {
        Object.keys(localStorage).forEach(function (k) {
          if (/^naqa_.*(cache|shell|sw)/i.test(k)) localStorage.removeItem(k);
        });
      } catch (e) {}
      msg.textContent = "تم المسح. اضغطي «افتحي اللوحة» أو انتظري التحويل…";
      setTimeout(function () { location.replace("admin.html?v=20261125purge2&_=" + Date.now()); }, 800);
    } catch (err) {
      msg.textContent = "تعذّر المسح التلقائي. امسحي بيانات الموقع يدوياً من إعدادات المتصفح ثم افتحي اللوحة.";
    }
  })();
  </script>
</body>
</html>
