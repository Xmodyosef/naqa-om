<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>تجربة 03 — أيقونة+نص فوق + شريط أدوات أبناء</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f6f0ed;color:#1f1a17;direction:rtl}
.wrap{max-width:980px;margin:0 auto;padding:12px}
.tag{display:inline-block;font-size:.7rem;font-weight:800;color:#8d3048;background:#f3e4e8;padding:4px 10px;border-radius:999px;margin-bottom:10px}
h1{font-size:1.05rem;margin:0 0 6px}
.note{color:#7a6a65;font-size:.82rem;margin:0 0 16px;line-height:1.5}
.demo{background:#fff;border:1px solid #eadfd9;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(40,20,24,.06)}
.main{padding:16px;min-height:220px}
.main h2{margin:0 0 8px;font-size:1rem}
.main p{margin:0;color:#7a6a65;font-size:.85rem;line-height:1.55}
.ph{height:10px;background:#f0e6e2;border-radius:6px;margin:10px 0}
.ph.w2{width:70%}.ph.w3{width:45%}
.card{background:#faf6f4;border:1px solid #eadfd9;border-radius:12px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">تجربة 03 · معاينة فقط · اللوحة الأصلية ما تغيّرت</span>
  <h1>أيقونة+نص فوق + شريط أدوات أبناء</h1>
  <p class="note">مثل تطبيقات الموبايل: آباء أفقيين بأيقونات. الأبناء شريط أدوات رمادي خفيف داخل الصفحة.<br>اضغطي الآباء والأبناء للتجربة. اختاري الرقم اللي يعجبك.</p>
  
<style>
.nav-p{display:flex;gap:6px;padding:10px 8px;overflow-x:auto;background:#fff;border-bottom:1px solid #eadfd9}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;border:0;background:0;padding:8px 6px;cursor:pointer;color:#7a6a65;border-radius:12px}
.pbtn .ico{width:36px;height:36px;border-radius:10px;background:#f3ebe8;display:grid;place-items:center;font-size:1rem}
.pbtn.on{color:#8d3048}
.pbtn.on .ico{background:#c46b7c;color:#fff;box-shadow:0 3px 8px rgba(196,107,124,.35)}
.pbtn span.l{font:700 .65rem inherit}
.toolbar{display:none;align-items:center;gap:6px;padding:8px 0 12px;flex-wrap:wrap}
.toolbar.show{display:flex}
.tb{border:0;background:#efe6e2;padding:7px 12px;border-radius:8px;font:700 .75rem inherit;cursor:pointer}
.tb.on{background:#c46b7c;color:#fff}
</style>
<div class="demo">
  <div class="nav-p" id="parents"></div>
  <div class="main">
    <div class="toolbar" id="children"></div>
    <h2 id="t">—</h2><p id="dscr"></p>
    <div class="ph w2"></div><div class="card">قائمة / جدول</div>
  </div>
</div>
<script>
const icons={home:'⌂',orders:'▤',products:'◈',reviews:'★',customers:'☺',finance:'₽',settings:'⚙'};
const tabs={home:{l:'الرئيسية'},orders:{l:'الطلبات',c:[['all','الكل'],['new','جديد'],['prep','تجهيز'],['ship','توصيل'],['done','تم'],['cancel','ملغي']]},products:{l:'المنتجات',c:[['all','الكل'],['shown','ظاهر'],['hidden','مخفي']]},reviews:{l:'التقييمات'},customers:{l:'العملاء'},finance:{l:'المالية'},settings:{l:'الإعدادات'}};
let cur='orders',sub='new';
const P=document.getElementById('parents'),C=document.getElementById('children');
function paint(){
  P.innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="pbtn ${k===cur?'on':''}" data-k="${k}"><span class="ico">${icons[k]}</span><span class="l">${v.l}</span></button>`).join('');
  const t=tabs[cur];
  document.getElementById('t').textContent=t.l;
  if(t.c){C.classList.add('show');C.innerHTML=t.c.map(([id,l])=>`<button class="tb ${sub===id?'on':''}" data-s="${id}">${l}</button>`).join('');}
  else{C.classList.remove('show');C.innerHTML='';}
  document.getElementById('dscr').textContent='الأب فوق · الابن داخل الصفحة فقط.';
}
P.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;cur=b.dataset.k;sub=tabs[cur].c?tabs[cur].c[0][0]:null;paint()};
C.onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;sub=b.dataset.s;paint()};
paint();
</script>

  <p class="note" style="margin-top:16px"><a href="nav-experiments.html">← كل التجارب</a></p>
</div>
</body>
</html>
