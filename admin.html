<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1f1a17" />
<title>لوحة تحكم نقاء</title>
<link rel="stylesheet" href="css/naqa.css?v=20261122a" />
<style>
  body{background:#f6f1ee}
  .admin-top{position:sticky;top:0;z-index:5;background:#1f1a17;color:#fff;padding:14px 16px 12px}
  .admin-top a{color:#fff;font-weight:700;font-size:.85rem}
  .admin-top h1{font-size:1.25rem;margin:6px 0 0}
  .admin-wrap{max-width:720px;margin:0 auto;padding:14px 14px 90px}
  .pin-card,.row{background:#fff;border:1px solid #efe4df;border-radius:16px;padding:14px;margin:10px 0}
  .pin-card input,.row input[type="number"],.token input{width:100%;border:1px solid #efe4df;border-radius:12px;padding:12px;font:inherit}
  .row{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}
  .row img,.ph{width:64px;height:64px;object-fit:contain;border-radius:12px;background:#f6f1ee}
  .row strong{display:block;font-size:.92rem;line-height:1.35}
  .row small{color:#8a7f78}
  .row .ed{grid-column:1 / -1;display:flex;gap:8px;align-items:center}
  .row .ed label{flex:1;font-size:.75rem;color:#8a7f78;font-weight:700}
  .hide{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.85rem;white-space:nowrap}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #efe4df;padding:10px 14px;display:flex;gap:8px}
  .savebar button,.pin-card button{flex:1;background:#b05c6e;color:#fff;border:0;border-radius:999px;padding:12px;font-weight:800;font:inherit}
  .ghost{background:#fff!important;color:#1f1a17!important;border:1px solid #efe4df!important}
  .note{font-size:.82rem;color:#8a7f78;line-height:1.5}
  .ok{color:#14532d;font-weight:800}
  #list[hidden],#pin[hidden],#tools[hidden]{display:none}
</style>
</head>
<body>
<div class="admin-top">
  <a href="index.html">رجوع للمتجر</a>
  <h1>لوحة تحكم نقاء</h1>
</div>
<div class="admin-wrap">
  <div class="pin-card" id="pin">
    <p>رمز الدخول تحفظينه على هذا الآيفون. أول مرة تختارينه.</p>
    <input id="pinInput" inputmode="numeric" maxlength="6" placeholder="٤ أرقام أو أكثر" />
    <button id="pinGo" type="button" style="margin-top:10px;width:100%">دخول</button>
    <p class="note" id="pinMsg"></p>
  </div>
  <div id="tools" hidden>
    <input id="q" type="search" placeholder="ابحثي بالاسم أو SKU" style="width:100%;border:1px solid #efe4df;border-radius:999px;padding:12px 14px;font:inherit" />
    <p class="note">تغيير السعر أو الإخفاء ينحفظ على جهازك فوراً. «نشر للكل» يحدّث المتجر لكل الزباين بعد ما تحطين رمز GitHub مرة واحدة.</p>
    <p class="ok" id="status"></p>
    <div class="token">
      <input id="token" type="password" placeholder="رمز GitHub للنشر (اختياري)" autocomplete="off" />
    </div>
    <div id="list"></div>
  </div>
</div>
<div class="savebar" id="savebar" hidden>
  <button id="saveLocal" type="button">حفظ على جهازي</button>
  <button id="publish" class="ghost" type="button">نشر للكل</button>
</div>
<script src="products.js?v=20261122a"></script>
<script src="data/products-care.js?v=20261122a"></script>
<script src="data/products-makeup.js?v=20261122a"></script>
<script src="data/products-hair.js?v=20261122a"></script>
<script src="data/products-more.js?v=20261122a"></script>
<script src="js/admin.js?v=20261122a"></script>
</body>
</html>
