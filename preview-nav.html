<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>خيارات مثل صورة سلة</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#0e2438;
  --navy-2:#132c45;
  --ink:#e8eef6;
  --muted:#8aa0b8;
  --teal:#2bbbad;
  --line:#e6edf3;
  --bg:#f4f7fa;
  --card:#fff;
  --rose:#8d3048;
}
*{box-sizing:border-box;margin:0}
body{font-family:"Noto Kufi Arabic",system-ui,Tahoma,sans-serif;background:#eceff3;color:#1b2836;min-height:100dvh}
.bar{background:#111;color:#fff;padding:12px 14px}
.bar h1{font-size:1rem;margin:0 0 4px}
.bar p{font-size:.78rem;opacity:.8;margin:0 0 10px}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.nums button{border:1px solid #333;background:#222;color:#fff;border-radius:10px;padding:8px 10px;font:800 .78rem inherit;cursor:pointer}
.nums button.on{background:var(--teal);border-color:var(--teal);color:#04241f}
.stage{
  max-width:1180px;margin:14px auto;background:var(--bg);border-radius:12px;overflow:hidden;min-height:640px;
  display:flex;flex-direction:row;direction:ltr;
  box-shadow:0 12px 40px rgba(0,0,0,.12);border:1px solid #d7e0e8;
}
/* Photo: dark menu is physically on the RIGHT. direction ltr + row so .main is left and .side is right. */
.main{order:1}
.side{order:2}
.side{
  width:228px;flex:0 0 228px;background:var(--navy);color:var(--ink);
  display:flex;flex-direction:column;padding:16px 12px 20px;gap:4px;min-height:640px;
  direction:rtl;
}
.logo{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 12px;font-weight:800;font-size:1.15rem}
.logo span{background:var(--teal);color:#04241f;border-radius:8px;padding:2px 8px;font-size:.85rem}
.shop{display:flex;align-items:center;gap:8px;background:var(--navy-2);border-radius:12px;padding:8px;margin:0 4px 8px}
.av{width:36px;height:36px;border-radius:10px;background:#2a4664;display:flex;align-items:center;justify-content:center;font-weight:800}
.shop small{display:block;color:var(--muted);font-size:.68rem}
.visit{margin:0 4px 12px;border:1px solid #2a4664;background:transparent;color:var(--ink);border-radius:999px;padding:7px 10px;font:700 .72rem inherit;cursor:pointer}
.item,.sub{
  border:0;background:transparent;color:var(--ink);width:100%;
  display:flex;align-items:center;gap:10px;text-align:inherit;
  padding:10px 10px;border-radius:10px;cursor:pointer;font:700 .86rem inherit;
}
.item .ico{width:22px;text-align:center;opacity:.9;flex:0 0 22px}
.item.on{background:rgba(43,187,173,.16);color:#fff}
.item .badge{margin-inline-start:auto;background:#e23b4a;color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:.68rem;display:flex;align-items:center;justify-content:center;padding:0 5px}
.sec{color:var(--teal);font-size:.72rem;font-weight:800;padding:14px 10px 4px}
.subs{display:none;flex-direction:column;gap:2px;padding-inline-start:18px}
.group.open .subs{display:flex}
.sub{font-size:.78rem;color:var(--muted);padding:7px 10px}
.sub.on{color:#fff;background:rgba(255,255,255,.06)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;direction:rtl;order:1}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center}
.search{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
.go{background:var(--teal);color:#04241f;border:0;border-radius:10px;padding:10px 14px;font:800 .85rem inherit;cursor:pointer}
.body{padding:16px;display:flex;flex-direction:column;gap:12px}
.kids{display:flex;gap:8px;flex-wrap:wrap}
.kid{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:800 .8rem inherit;cursor:pointer}
.kid.on{background:var(--teal);border-color:var(--teal);color:#04241f}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:1rem;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:.86rem}
.note{color:#667;font-size:.78rem;line-height:1.5}
/* variants */
.M2 .side,.M3 .side,.M4 .side,.M5 .side,.M6 .side,.M7 .side,.M8 .side{background:var(--navy)}
.M5{ --teal:var(--rose); }
.M5 .logo span,.M5 .go,.M5 .kid.on{background:var(--rose);color:#fff}
.M5 .sec,.M5 .visit{color:#f3c3cf;border-color:#5a3040}
.M5 .side{background:#2a1520}
.M4 .side{width:72px;flex-basis:72px;align-items:center;order:2}
.M4 .item span:not(.ico):not(.badge),.M4 .logo b,.M4 .shop,.M4 .visit,.M4 .sec,.M4 .subs{display:none}
.M4 .item{justify-content:center;padding:12px 0}
.M6 .kids{flex-wrap:nowrap;overflow-x:auto}
.M6{--teal:#c46b7c;background:#f7f2ef}
.M6 .side{background:linear-gradient(180deg,#302025 0%,#241619 100%);color:#f1e7e4}
.M6 .logo span,.M6 .go,.M6 .kid.on{background:linear-gradient(135deg,#c46b7c 0%,#9d3d58 100%);border-color:#c46b7c;color:#fff}
.M6 .shop{background:#3d2a2e}
.M6 .av{background:#c46b7c;color:#fff}
.M6 .item.on{background:linear-gradient(135deg,#c46b7c 0%,#9d3d58 100%);color:#fff}
.M6 .sec{color:#e6a4b0}
.M6 .search{background:#fff;border-color:#eadfd9}
.M6 .card{background:#fff;border-color:#eadfd9}
.M6 .kid{border-color:#eadfd9;color:#2a211f}
.M8 .subs{display:none!important}
.fly{display:none}
.M8 .fly.show{display:flex;flex-direction:column;position:absolute;inset-inline-end:236px;top:120px;background:var(--navy);border:1px solid #2a4664;border-radius:12px;padding:8px;min-width:160px;z-index:3}
.stage{position:relative}
@media(max-width:800px){
  .stage{flex-direction:row;min-height:100dvh;border-radius:0;margin:0;max-width:none}
  .side{width:132px;flex:0 0 132px;min-height:100dvh;padding:10px 8px;order:2}
  .main{order:1}
  .shop small,.visit{display:none}
  .logo{font-size:.95rem;padding-bottom:8px}
  .item{font-size:.72rem;padding:9px 6px;gap:6px}
  .item .ico{flex-basis:16px;width:16px}
}
@media(max-width:600px){
  .bar{padding:9px 10px 10px}
  .bar h1{font-size:.82rem;line-height:1.35;margin-bottom:3px}
  .bar p{font-size:.62rem;line-height:1.45;margin-bottom:7px}
  .nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .nums button{min-width:0;padding:6px 3px;border-radius:8px;font-size:.59rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stage{min-height:calc(100dvh - 142px);height:calc(100dvh - 142px);overflow:hidden}
  .side{width:104px;flex:0 0 104px;padding:8px 5px;gap:2px;min-height:100%;overflow-y:auto}
  .logo{font-size:.78rem;padding:2px 4px 7px}
  .logo span{padding:1px 5px;font-size:.65rem}
  .shop{gap:4px;padding:5px;margin:0 1px 5px;border-radius:9px}
  .shop strong{font-size:.62rem;line-height:1.25}
  .shop small,.visit{display:none}
  .av{width:25px;height:25px;border-radius:7px;font-size:.7rem}
  .item{font-size:.61rem;line-height:1.25;padding:7px 3px;gap:4px;border-radius:8px}
  .item .ico{width:15px;flex-basis:15px;font-size:.78rem}
  .item .badge{min-width:15px;height:15px;font-size:.56rem;padding:0 3px}
  .main{min-width:0}
  .top{padding:7px;display:flex;flex-direction:column;align-items:stretch;gap:5px}
  .search,.go{width:100%;min-height:38px}
  .search{padding:8px 9px;font-size:.7rem}
  .go{padding:8px 10px;font-size:.72rem}
  .body{padding:8px;gap:8px;min-width:0;overflow:hidden}
  .kids{gap:5px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .kid{flex:0 0 auto;padding:6px 10px;font-size:.64rem;white-space:nowrap}
  .card{padding:10px;border-radius:11px}
  .card h2{font-size:.86rem;margin-bottom:5px}
  .note{font-size:.65rem}
  .row{padding:8px 0;font-size:.7rem}
}
</style>
</head>
<body>
<header class="bar">
  <h1>نفس صورة سلة — اختاري رقم</h1>
  <p>الجنب يمين، داكن، أيقونة + اسم كامل. المحتوى يفتح في باقي الصفحة. مو السكة الصغيرة.</p>
  <div class="nums" id="nums"></div>
</header>
<div class="stage" id="stage"></div>
<script>
(function(){
  var MODES = [
    {n:1, name:"مثل الصورة", d:"جنب داكن كامل يمين. تضغطين القسم والمحتوى يتغير. بدون فروع."},
    {n:2, name:"فروع في الصفحة", d:"نفس الجنب. حالات الطلبات تظهر أزرار فوق المحتوى."},
    {n:3, name:"فروع تحت الزر", d:"نفس الجنب الداكن. الفروع تنفتح تحته داخل القائمة."},
    {n:4, name:"أيقونات فقط", d:"نفس الألوان، الجنب يضيق لأيقونات مثل وضع الطي."},
    {n:5, name:"ألوان نقاء", d:"نفس تركيب الصورة، اللون الوردي بدل التركواز."},
    {n:6, name:"تمرير الفروع", d:"الفروع صف واحد يتمرّر يمين ويسار فوق المحتوى."},
    {n:7, name:"أقسام مثل الصورة", d:"تشغيل ثم عنوان تسويق، نفس تجميع سلة."},
    {n:8, name:"قائمة جانبية طافية", d:"تضغطين الطلبات فتطلع الحالات بجانب الجنب."}
  ];
  var items = [
    {id:"home", ico:"⌂", label:"الرئيسية"},
    {id:"products", ico:"▣", label:"المنتجات"},
    {id:"orders", ico:"▤", label:"الطلبات", badge:1},
    {id:"customers", ico:"☺", label:"العملاء"},
    {id:"reviews", ico:"★", label:"التقييمات"},
    {id:"finance", ico:"٪", label:"المالية"},
    {id:"settings", ico:"⚙", label:"الإعدادات"}
  ];
  var kids = {
    orders:["الكل","جديد","تجهيز","توصيل","تم","ملغي"],
    products:["الكل","الظاهرة","المخفية"]
  };
  var state = {mode:1, tab:"products", sub:"الكل", fly:false};

  var nums = document.getElementById("nums");
  MODES.forEach(function(m){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = m.n + " " + m.name;
    b.onclick = function(){ state.mode = m.n; state.fly = false; render(); };
    nums.appendChild(b);
  });

  function kidList(){ return kids[state.tab] || []; }

  function render(){
    document.querySelectorAll("#nums button").forEach(function(b,i){ b.classList.toggle("on", i+1===state.mode); });
    var m = MODES[state.mode-1];
    var side = '<aside class="side"><div class="logo"><b>نقاء</b><span>ن</span></div>';
    side += '<div class="shop"><div class="av">ن</div><div><strong>متجر نقاء</strong><small>لوحة التحكم</small></div></div>';
    side += '<button class="visit" type="button">زيارة المتجر</button>';
    items.forEach(function(it, idx){
      if (state.mode===7 && idx===4) side += '<div class="sec">التقارير</div>';
      var on = state.tab===it.id;
      var badge = it.badge ? '<span class="badge">'+it.badge+'</span>' : '';
      var open = (state.mode===3 && on && kidList().length);
      side += '<div class="group'+(open?' open':'')+'">';
      side += '<button type="button" class="item'+(on?' on':'')+'" data-tab="'+it.id+'"><span class="ico">'+it.ico+'</span><span>'+it.label+'</span>'+badge+'</button>';
      if (state.mode===3 && (it.id==="orders"||it.id==="products")){
        side += '<div class="subs">';
        (kids[it.id]||[]).forEach(function(k){
          side += '<button type="button" class="sub'+((on && state.sub===k)?' on':'')+'" data-sub="'+k+'">'+k+'</button>';
        });
        side += '</div>';
      }
      side += '</div>';
    });
    side += '</aside>';

    var ks = kidList();
    var showKids = (state.mode===2 || state.mode===6) && ks.length;
    var kidsHtml = '';
    if (showKids){
      kidsHtml = '<div class="kids">'+ks.map(function(k){
        return '<button type="button" class="kid'+(state.sub===k?' on':'')+'" data-sub="'+k+'">'+k+'</button>';
      }).join('')+'</div>';
    }
    var fly = '';
    if (state.mode===8 && state.fly && ks.length){
      fly = '<div class="fly show">'+ks.map(function(k){
        return '<button type="button" class="sub'+(state.sub===k?' on':'')+'" data-sub="'+k+'">'+k+'</button>';
      }).join('')+'</div>';
    }
    var title = (items.filter(function(i){return i.id===state.tab;})[0]||{}).label || '';
    var body = '<div class="body">'+kidsHtml+
      '<div class="card"><h2>'+title+(state.sub && ks.length?' · '+state.sub:'')+'</h2>'+
      '<p class="note">'+m.d+'</p>'+
      '<div class="row"><span>عنصر تجريبي</span><strong>٢٢٢٫٠٠ ر.س</strong></div>'+
      '<div class="row"><span>عنصر تجريبي ٢</span><strong>١١١٫٠٠ ر.س</strong></div>'+
      '</div></div>';
    var top = '<div class="top"><input class="search" placeholder="ابحثي برقم الطلب، اسم العميل، رقم الشحنة" /><button class="go" type="button">إضافة</button></div>';
    document.getElementById("stage").className = "stage M"+state.mode;
    document.getElementById("stage").innerHTML = side + '<div class="main">'+top+body+'</div>'+fly;

    document.getElementById("stage").onclick = function(e){
      var sub = e.target.closest("[data-sub]");
      var tab = e.target.closest("[data-tab]");
      if (sub && sub.getAttribute("data-sub")){
        state.sub = sub.getAttribute("data-sub");
        state.fly = false;
        render();
        return;
      }
      if (tab){
        state.tab = tab.getAttribute("data-tab");
        state.sub = (kidList()[0]||"");
        state.fly = state.mode===8 && (state.tab==="orders"||state.tab==="products");
        render();
      }
    };
  }
  render();
})();
</script>
</body>
</html>
