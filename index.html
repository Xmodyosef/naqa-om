<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#b05c6e" />
<meta name="description" content="نقاء — عناية ومكياج. متجر عُماني. توصيل لكل السلطنة." />
<title>نقاء · عناية ومكياج | www.naqa.om</title>
<style>
:root{
  --bg:#fdf8f6; --card:#fff; --fg:#1f1a17; --muted:#8a7f78;
  --rose:#d98a9a; --rose-deep:#b05c6e; --line:#efe4df;
  --shadow:0 10px 30px rgba(50,30,25,.08); --r:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Noto Kufi Arabic","Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6;
  padding-bottom:72px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:60;background:rgba(253,248,246,.94);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;height:68px}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo-mark{width:40px;height:40px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--rose-deep)}
.logo-text{display:flex;flex-direction:column;line-height:1.15}
.logo-text strong{font-size:1.25rem;font-weight:800}
.logo-text span{font-size:.72rem;color:var(--muted);font-weight:600}
.search{flex:1;display:flex;align-items:center;gap:8px;background:#fff;
  border:1px solid var(--line);border-radius:999px;padding:9px 14px;max-width:420px;margin:0 auto}
.search input{border:none;outline:none;width:100%;font:inherit;background:transparent;font-size:.95rem}
.lang-btn{height:42px;min-width:46px;padding:0 10px;border-radius:12px;background:#fff;
  border:1px solid var(--line);font-weight:800;flex-shrink:0}
.icon-btn{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;position:relative;flex-shrink:0}
.icon-btn .badge{position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;padding:0 5px;
  border-radius:999px;background:var(--rose-deep);color:#fff;font-size:.7rem;font-weight:700;
  display:grid;place-items:center}
.nav-cats{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.nav-cats::-webkit-scrollbar{display:none}
.nav-cats a{flex-shrink:0;padding:8px 14px;border-radius:999px;background:#fff;
  border:1px solid var(--line);font-size:.88rem;font-weight:600;color:var(--muted);scroll-snap-align:start}
.nav-cats a.on{background:var(--rose-deep);color:#fff;border-color:var(--rose-deep)}

.hero{margin:18px 0 8px;padding:28px 22px;border-radius:var(--r);background:
  linear-gradient(135deg,#fff 0%,#f8ebe8 55%,#f3e0d8 100%);
  border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:10px}
.hero h1{margin:0;font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;line-height:1.25}
.hero h1 em{font-style:normal;color:var(--rose-deep)}
.hero p{margin:0;color:var(--muted);max-width:42em;font-size:.98rem}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border-radius:999px;font-weight:700;font-size:.95rem}
.btn-primary{background:var(--rose-deep);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:6px 12px;border-radius:999px;background:rgba(176,92,110,.1);color:var(--rose-deep);font-size:.8rem;font-weight:700}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 12px}
.section-head h2{margin:0;font-size:1.2rem;font-weight:800}
.section-head span{color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  content-visibility:auto;contain-intrinsic-size:280px 380px}
.card-visual{position:relative;aspect-ratio:1;background:#fff;overflow:hidden;cursor:pointer}
.card-visual img{width:100%;height:100%;object-fit:contain;background:#fff}
.card-ar-tag{position:absolute;left:8px;right:8px;bottom:8px;padding:6px 8px;border-radius:10px;
  background:rgba(31,26,23,.78);color:#fff;font-size:.68rem;font-weight:700;line-height:1.35;
  text-align:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html[lang="en"] .card-ar-tag{display:none}
.card-body{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-brand{font-size:.72rem;color:var(--muted);font-weight:600}
.card-name{font-weight:700;font-size:.92rem;line-height:1.35;min-height:2.5em;text-align:start;width:100%}
.card-desc{color:var(--muted);font-size:.75rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-code{font-size:.68rem;color:var(--muted);font-family:ui-monospace,monospace}
.card-price{font-weight:800;color:var(--rose-deep);margin-top:4px;font-size:1.02rem}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.card-actions .quick{padding:9px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:.78rem;background:#fff}
.card-actions .add{padding:9px;border-radius:12px;background:var(--fg);color:#fff;font-weight:700;font-size:.78rem}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* sticky cart bar on product list */
.cart-bar{position:fixed;bottom:0;left:0;right:0;z-index:55;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:rgba(253,248,246,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);display:flex;gap:10px;align-items:center;justify-content:space-between}
.cart-bar.hidden{display:none}
.cart-bar .info{font-weight:700;font-size:.9rem}
.cart-bar .info span{color:var(--muted);font-weight:600;font-size:.8rem}
.cart-bar .go{padding:12px 16px;border-radius:999px;background:var(--rose-deep);color:#fff;font-weight:800}

.overlay{position:fixed;inset:0;background:rgba(20,12,10,.35);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(400px,92vw);background:#fff;z-index:90;
  transform:translateX(-105%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
html[dir="ltr"] .drawer{left:auto;right:0;transform:translateX(105%)}
.drawer.show,html[dir="ltr"] .drawer.show{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}
.drawer-head h3{margin:0}
.drawer-body{flex:1;overflow:auto;padding:12px 16px;-webkit-overflow-scrolling:touch}
.cart-item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-item .thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;background:#fff}
.cart-item .thumb img{width:100%;height:100%;object-fit:contain}
.cart-item .meta strong{display:block;font-size:.9rem}
.cart-item .meta span{color:var(--muted);font-size:.8rem}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-weight:700}
.rm{color:var(--rose-deep);font-size:.8rem;font-weight:700;margin-top:4px}
.drawer-foot{padding:14px 16px 20px;border-top:1px solid var(--line)}
.total-row{display:flex;justify-content:space-between;font-weight:800;margin-bottom:12px}
.total-row span:last-child{color:var(--rose-deep);font-size:1.15rem}
.checkout{width:100%;padding:14px;border-radius:14px;background:#25D366;color:#fff;font-weight:800}
.cart-empty{padding:40px 10px;text-align:center;color:var(--muted)}

footer{margin-top:40px;padding:28px 0 100px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.foot-grid{display:grid;gap:18px}
@media(min-width:700px){.foot-grid{grid-template-columns:2fr 1fr 1fr}}
footer h4{margin:0 0 8px;color:var(--fg)}
.foot-brand{font-weight:800;color:var(--fg);font-size:1.15rem}
.foot-brand span{color:var(--rose-deep)}
.wa-float{position:fixed;bottom:76px;left:16px;z-index:50;width:52px;height:52px;border-radius:50%;
  background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(37,211,102,.4);font-size:1.45rem}
html[dir="ltr"] .wa-float{left:auto;right:16px}

/* full product / quick view */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(20,12,10,.45);display:none;align-items:stretch;justify-content:center}
.sheet.show{display:flex}
.sheet-card{background:#fff;width:min(680px,100%);height:100%;overflow:auto;padding:0 0 40px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-pad{padding:12px 16px 0}
.swipe-hint{font-size:.75rem;color:var(--muted);margin:0 0 8px;font-weight:600}
.text-back{font-weight:800;color:var(--rose-deep);margin-bottom:8px;font-size:.95rem}

/* carousel full width */
.carousel{position:relative;width:100%;background:#f3eeea;touch-action:pan-y}
.carousel-track{display:flex;transition:transform .28s ease;will-change:transform}
.carousel-track.dragging{transition:none}
.carousel-slide{min-width:100%;height:min(78vw,460px);display:grid;place-items:center;background:#fff;position:relative}
.carousel-slide img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;background:#fff}
.carousel-ar{position:absolute;left:12px;right:12px;bottom:12px;padding:10px 12px;border-radius:12px;
  background:rgba(31,26,23,.8);color:#fff;font-size:.85rem;font-weight:700;text-align:center;line-height:1.4}
html[lang="en"] .carousel-ar{display:none}
.carousel-dots{display:flex;justify-content:center;gap:6px;padding:10px 0 4px}
.carousel-dots button{width:8px;height:8px;border-radius:999px;background:#d9cfc8}
.carousel-dots button.on{background:var(--rose-deep);width:18px}
.carousel-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:999px;
  background:rgba(255,255,255,.92);border:1px solid var(--line);font-weight:800;z-index:2}
.carousel-nav.prev{inset-inline-start:10px}
.carousel-nav.next{inset-inline-end:10px}

.block-h{margin:16px 0 6px;font-size:1rem}
.long{margin:0;line-height:1.75}
.sku-line{margin-top:8px;font-size:.85rem;color:var(--muted);font-family:ui-monospace,monospace}
.skin-pill{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:999px;background:rgba(176,92,110,.1);color:var(--rose-deep);font-size:.8rem;font-weight:700}
.sug-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px}
.sug{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;text-align:start}
.sug-vis{display:block;height:100px;border-radius:10px;overflow:hidden;background:#fff}
.sug-vis img{width:100%;height:100px;object-fit:contain}
.sug-name{display:block;font-size:.78rem;font-weight:700;margin-top:6px;line-height:1.35}
.sug-price{display:block;color:var(--rose-deep);font-weight:800;font-size:.85rem}
.sheet .card-add{margin:12px 16px 0;width:calc(100% - 32px);padding:12px;border-radius:12px;background:var(--fg);color:#fff;font-weight:700}
.sheet-body{padding:0 16px}

/* quick view smaller sheet */
.sheet.quick .sheet-card{height:auto;max-height:88vh;align-self:flex-end;border-radius:20px 20px 0 0;width:min(560px,100%)}
.sheet.quick .carousel-slide{height:min(58vw,320px)}

.lightbox{position:fixed;inset:0;z-index:120;background:rgba(10,8,6,.94);display:none;align-items:center;justify-content:center;padding:12px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lightbox-close{position:absolute;top:14px;inset-inline-end:14px;width:42px;height:42px;border-radius:999px;background:#fff;font-weight:800}
</style>
</head>

const pskin=p=>lang==="en"?(p.skinEn||p.skinAr||""):(p.skinAr||p.skinEn||"");
const pimgs=p=>(Array.isArray(p.imgs)?p.imgs:[]).filter(Boolean).slice(0,5);
function saveCart(){try{localStorage.setItem("naqa_cart",JSON.stringify(cart))}catch(e){}}

function visual(p,i){
  const imgs=pimgs(p); const src=imgs[i||0];
  if(!src) return p.em||"✨";
  return '<img src="'+src+'" alt="'+pname(p)+'" loading="lazy" decoding="async" onerror="this.style.opacity=.2">';
}

function applyLang(){
  document.documentElement.lang=lang==="en"?"en":"ar";
  document.documentElement.dir=lang==="en"?"ltr":"rtl";
  $("#search").placeholder=T("search");
  document.querySelectorAll("#cats a").forEach(a=>{a.textContent=T(catLabel[a.dataset.cat]||"all")});
  $("#heroTitle").innerHTML=T("heroTitle")+"<em>"+T("heroEm")+"</em>";
  $("#heroText").textContent=T("hero");
  $("#btnShop").textContent=T("shop");
  $("#waHero").textContent=T("wa");
  $("#products").textContent=T("products");
  $("#cartTitle").textContent=T("cart");
  $("#totalLabel").textContent=T("total");
  $("#checkoutBtn").textContent=T("checkout");
  $("#langBtn").textContent=lang==="ar"?"EN":"AR";
  $("#logoName").textContent=T("logo");
  $("#logoTag").textContent=T("tag");
  $("#pillShip").textContent=T("ship");
  $("#pillWa").textContent=T("order");
  $("#footContact").textContent=T("contact");
  $("#footShop").textContent=T("shopH");
  $("#jumpCare").textContent=T("skin");
  $("#jumpFace").textContent=T("faceL");
  $("#jumpScent").textContent=T("scentL");
  $("#jumpHair").textContent=T("hairL");
  $("#copyLine").textContent=T("copy");
  $("#waFooter").textContent=T("orders");
  $("#footBlurb").innerHTML=T("blurb")+"<br/>www.naqa.om";
  $("#cartBarBtn").textContent=T("barGo");
}

function render(){
  applyLang();
  const q=query.toLowerCase();
  const list=products.filter(p=>{
    const ok=currentCat==="all"||p.cat===currentCat;
    const blob=[p.nameAr,p.nameEn,p.brand,p.sku,p.descAr,p.descEn].join(" ").toLowerCase();
    return ok && (!q || blob.includes(q));
  });
  $("#countLabel").textContent=T("count")(list.length);
  $("#empty").hidden=list.length>0;
  $("#empty").textContent=T("empty");
  $("#grid").innerHTML=list.map(p=>`
    <article class="card" data-id="${p.id}">
      <div class="card-visual" data-open="${p.id}">
        ${visual(p,0)}
        <div class="card-ar-tag">${p.nameAr||pname(p)}</div>
      </div>
      <div class="card-body">
        <div class="card-brand">${p.brand} · ${T(catLabel[p.cat]||"all")}</div>
        <button class="card-name" data-open="${p.id}" type="button">${pname(p)}</button>
        <div class="card-desc">${pdesc(p)}</div>
        <div class="card-code">${T("sku")}: ${p.sku||T("noSku")}</div>
        <div class="card-price">${money(p.price)}</div>
        <div class="card-actions">
          <button class="quick" data-quick="${p.id}" type="button">${T("quick")}</button>
          <button class="add" data-add="${p.id}" type="button">${T("add")}</button>
        </div>
      </div>
    </article>`).join("");
  renderCart();
  if(openProductId) openProduct(openProductId, mode, false);
}

function carouselHTML(p, start){
  let imgs=pimgs(p);
  if(!imgs.length) imgs=[""];
  while(imgs.length<4) imgs.push(imgs[imgs.length-1]||"");
  imgs=imgs.slice(0,5);
  const slides=imgs.map((src,i)=>`
    <div class="carousel-slide" data-i="${i}">
      ${src?`<img src="${src}" alt="${pname(p)}" data-full="${src}" loading="${i? 'lazy':'eager'}">`:(p.em||"✨")}
      <div class="carousel-ar">${p.nameAr||pname(p)}</div>
    </div>`).join("");
  const dots=imgs.map((_,i)=>`<button type="button" data-dot="${i}" class="${i===start?'on':''}"></button>`).join("");
  return `
    <div class="carousel" id="carousel" data-n="${imgs.length}">
      <button class="carousel-nav prev" type="button" data-nav="-1" aria-label="prev">‹</button>
      <button class="carousel-nav next" type="button" data-nav="1" aria-label="next">›</button>
      <div class="carousel-track" id="carTrack" style="transform:translateX(${document.documentElement.dir==='rtl'? '' : '-'}${start*100}%)">${slides}</div>
      <div class="carousel-dots">${dots}</div>
    </div>`;
}

function setCarousel(i){
  const car=$("#carousel"); if(!car) return;
  const n=+car.dataset.n||1;
  galleryIndex=((i%n)+n)%n;
  const track=$("#carTrack");
  const rtl=document.documentElement.dir==="rtl";
  // In RTL flex, first slide is on the right; translateX positive moves leftward content...
  // Use percentage relative to track: simpler approach - always LTR track
  track.style.direction="ltr";
  track.style.transform=`translateX(-${galleryIndex*100}%)`;
  car.querySelectorAll("[data-dot]").forEach(d=>d.classList.toggle("on", +d.dataset.dot===galleryIndex));
}

function openProduct(id, m="full", reset=true){
  const p=products.find(x=>x.id===id); if(!p) return;
  openProductId=id; mode=m;
  if(reset) galleryIndex=0;
  const sheet=$("#sheet");
  sheet.classList.toggle("quick", m==="quick");
  const sug=products.filter(x=>x.cat===p.cat && x.id!==p.id).slice(0,4);
  const cards=sug.map(s=>`
    <button class="sug" data-open="${s.id}" type="button">
      <span class="sug-vis">${visual(s,0)}</span>
      <span class="sug-name">${pname(s)}</span>
      <span class="sug-price">${money(s.price)}</span>
    </button>`).join("");
  $("#sheetCard").innerHTML=`
    <div class="sheet-pad">
      <p class="swipe-hint">${T("swipe")} · ${T("openImg")}</p>
      <button class="text-back" id="closeSheet" type="button">‹ ${T("back")}</button>
    </div>
    ${carouselHTML(p, galleryIndex)}
    <div class="sheet-body">
      <div class="card-brand" style="margin-top:10px">${p.brand} · ${T(catLabel[p.cat]||"all")}</div>
      <h3 style="margin:6px 0 4px">${pname(p)}</h3>
      <div class="card-price">${money(p.price)}</div>
      <div class="sku-line">${T("sku")}: ${p.sku||T("noSku")}</div>
      <span class="skin-pill">${T("skinT")}: ${pskin(p)}</span>
      <h4 class="block-h">${T("about")}</h4>
      <p class="long">${pdesc(p)}</p>
      ${m==="full"?`<h4 class="block-h">${T("how")}</h4><p class="long">${puse(p)}</p>`:""}
    </div>
    <button class="card-add" data-add="${p.id}" type="button">${T("add")}</button>
    ${m==="full"?`<h4 class="block-h" style="padding:0 16px">${T("also")}</h4><div class="sug-row">${cards}</div>`:
      `<div class="sheet-pad"><button class="btn btn-ghost" data-open-full="${p.id}" type="button" style="width:100%;border:1px solid var(--line);margin-top:8px">${T("open")}</button></div>`}
  `;
  sheet.classList.add("show");
  $("#sheetCard").scrollTop=0;
  setCarousel(galleryIndex);
  $("#closeSheet").onclick=closeSheet;
  bindCarousel();
  try{ if(m==="full") history.pushState({naqa:"product",id},""); }catch(e){}
}

function bindCarousel(){
  const car=$("#carousel"); if(!car) return;
  car.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>setCarousel(galleryIndex+(+b.dataset.nav)));
  car.querySelectorAll("[data-dot]").forEach(b=>b.onclick=()=>setCarousel(+b.dataset.dot));
  // swipe photos
  let x0=null,y0=null,dx=0;
  const track=$("#carTrack");
  track.addEventListener("touchstart",e=>{
    const t=e.changedTouches[0]; x0=t.clientX; y0=t.clientY; dx=0; track.classList.add("dragging");
  },{passive:true});
  track.addEventListener("touchmove",e=>{
    if(x0==null) return;
    const t=e.changedTouches[0];
    if(Math.abs(t.clientY-y0)>Math.abs(t.clientX-x0)+8) return;
    dx=t.clientX-x0;
    const base=-galleryIndex*car.offsetWidth;
    track.style.transform=`translateX(${base+dx}px)`;
  },{passive:true});
  track.addEventListener("touchend",()=>{
    track.classList.remove("dragging");
    if(Math.abs(dx)>40){ setCarousel(galleryIndex+(dx<0?1:-1)); }
    else setCarousel(galleryIndex);
    x0=null; dx=0;
  },{passive:true});
  // tap image to lightbox
  car.addEventListener("click",e=>{
    const img=e.target.closest("img[data-full]");
    if(img) openLightbox(img.dataset.full||img.src);
  });
}

function closeSheet(){
  $("#sheet").classList.remove("show");
  $("#sheet").classList.remove("quick");
  openProductId=null;
  const card=$("#sheetCard");
  if(card){ card.style.transform=""; card.style.transition=""; }
}

function openLightbox(src){
  if(!src) return;
  $("#lbImg").src=src;
  $("#lightbox").classList.add("show");
}
function closeLightbox(){
  $("#lightbox").classList.remove("show");
  $("#lbImg").removeAttribute("src");
}

function renderCart(){
  const n=cart.reduce((s,i)=>s+i.qty,0);
  const badge=$("#cartBadge");
  if(n){badge.hidden=false; badge.textContent=n;} else badge.hidden=true;
  const bar=$("#cartBar");
  if(n){ bar.classList.remove("hidden"); $("#cartBarInfo").innerHTML=T("barItems")(n)+"<br><span>"+money(cart.reduce((s,i)=>s+i.price*i.qty,0))+"</span>"; }
  else bar.classList.add("hidden");
  if(!cart.length){
    $("#cartBody").innerHTML=`<div class="cart-empty">${T("emptyCart")}</div>`;
    $("#cartTotal").textContent=money(0); return;
  }
  $("#cartBody").innerHTML=cart.map(i=>{
    const p=products.find(x=>x.id===i.id)||i;
    return `<div class="cart-item">
      <div class="thumb">${visual(p,0)}</div>
      <div class="meta">
        <strong>${pname(p)}</strong>
        <span>${money(i.price)} · ${p.brand||""}</span>
        <div class="sku-line">${T("sku")}: ${p.sku||"—"}</div>
        <button class="rm" data-rm="${i.id}">${T("del")}</button>
      </div>
      <div class="qty">
        <button data-dec="${i.id}">−</button><b>${i.qty}</b><button data-inc="${i.id}">+</button>
      </div>
    </div>`;
  }).join("");
  $("#cartTotal").textContent=money(cart.reduce((s,i)=>s+i.price*i.qty,0));
}

function addToCart(id){
  const p=products.find(x=>x.id===id); if(!p) return;
  const row=cart.find(x=>x.id===id);
  if(row) row.qty++; else cart.push({id:p.id,brand:p.brand,price:p.price,sku:p.sku,qty:1});
  saveCart(); renderCart();
}
function openCart(){$("#overlay").classList.add("show"); $("#drawer").classList.add("show")}
function closeCart(){$("#overlay").classList.remove("show"); $("#drawer").classList.remove("show")}

$("#grid").addEventListener("click",e=>{
  const add=e.target.closest("[data-add]"); if(add){addToCart(+add.dataset.add); return}
  const q=e.target.closest("[data-quick]"); if(q){openProduct(+q.dataset.quick,"quick"); return}
  const o=e.target.closest("[data-open]"); if(o){openProduct(+o.dataset.open,"full"); return}
});
$("#sheet").addEventListener("click",e=>{
  if(e.target.id==="sheet"){closeSheet(); return}
  const add=e.target.closest("[data-add]"); if(add){addToCart(+add.dataset.add); return}
  const full=e.target.closest("[data-open-full]"); if(full){openProduct(+full.dataset.openFull,"full"); return}
  const o=e.target.closest("[data-open]"); if(o && e.target.closest("#sheetCard")){openProduct(+o.dataset.open,"full"); return}
});
$("#cartBody").addEventListener("click",e=>{
  const inc=e.target.closest("[data-inc]"); const dec=e.target.closest("[data-dec]"); const rm=e.target.closest("[data-rm]");
  if(inc){const it=cart.find(i=>i.id===+inc.dataset.inc); if(it)it.qty++; saveCart(); renderCart()}
  if(dec){const it=cart.find(i=>i.id===+dec.dataset.dec); if(it){it.qty--; if(it.qty<=0)cart=cart.filter(x=>x.id!==it.id)} saveCart(); renderCart()}
  if(rm){cart=cart.filter(i=>i.id!==+rm.dataset.rm); saveCart(); renderCart()}
});
$("#cartBtn").onclick=openCart;
$("#cartBarBtn").onclick=openCart;
$("#closeCart").onclick=closeCart;
$("#overlay").onclick=closeCart;
$("#search").addEventListener("input",e=>{query=e.target.value.trim(); render()});
$("#langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar"; try{localStorage.setItem("naqa_lang",lang)}catch(e){} render()};
$("#cats").addEventListener("click",e=>{
  const a=e.target.closest("[data-cat]"); if(!a)return; e.preventDefault();
  document.querySelectorAll("#cats a").forEach(x=>x.classList.remove("on")); a.classList.add("on");
  currentCat=a.dataset.cat; render(); $("#products").scrollIntoView({behavior:"smooth"});
});
document.querySelectorAll("[data-cat-jump]").forEach(el=>el.addEventListener("click",e=>{
  e.preventDefault(); currentCat=el.dataset.catJump;
  document.querySelectorAll("#cats a").forEach(x=>x.classList.toggle("on", x.dataset.cat===currentCat));
  render(); $("#products").scrollIntoView({behavior:"smooth"});
}));
$("#checkoutBtn").onclick=()=>{
  if(!cart.length){alert(T("alertEmpty")); return}
  const lines=cart.map(i=>{const p=products.find(x=>x.id===i.id)||i;
    return "• "+pname(p)+" × "+i.qty+" = "+money(i.price*i.qty)+" ["+T("sku")+" "+(p.sku||"—")+"]"}).join("\n");
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const msg=T("greet")+" ("+SITE+"):\n\n"+lines+"\n\n"+T("total")+": "+money(total);
  window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(msg),"_blank");
};
$("#lbClose").onclick=closeLightbox;
$("#lightbox").addEventListener("click",e=>{if(e.target.id==="lightbox"||e.target.id==="lbClose")closeLightbox()});

// edge swipe back (left → right)
(function(){
  let x0=null,y0=null,tracking=false;
  const sheet=$("#sheet"), card=$("#sheetCard");
  sheet.addEventListener("touchstart",e=>{
    if(!sheet.classList.contains("show")||$("#lightbox").classList.contains("show"))return;
    const t=e.changedTouches[0]; if(t.clientX>32){x0=null;return}
    x0=t.clientX; y0=t.clientY; tracking=true; card.style.transition="none";
  },{passive:true});
  sheet.addEventListener("touchmove",e=>{
    if(!tracking||x0==null)return;
    const t=e.changedTouches[0]; const dx=t.clientX-x0; const dy=Math.abs(t.clientY-y0);
    if(dy>48 && Math.abs(dx)<24){tracking=false; card.style.transform=""; return}
    if(dx>0) card.style.transform="translateX("+Math.min(dx,140)+"px)";
  },{passive:true});
  sheet.addEventListener("touchend",e=>{
    if(!tracking||x0==null)return;
    const dx=e.changedTouches[0].clientX-x0; tracking=false; x0=null;
    card.style.transition="transform .22s ease";
    if(dx>72) closeSheet(); else card.style.transform="";
  },{passive:true});
})();

window.addEventListener("popstate",()=>{
  if($("#lightbox").classList.contains("show")){closeLightbox(); return}
  if($("#sheet").classList.contains("show")){closeSheet(); return}
});

function boot(){
  try{
    if(!products.length) throw new Error("products.js missing");
    const wa="https://wa.me/"+WA_NUMBER;
    $("#waFooter").href=wa; $("#waFloat").href=wa; $("#waHero").href=wa;
    $("#yr").textContent=new Date().getFullYear();
    try{history.replaceState({naqa:"home"},"")}catch(e){}
    render();
  }catch(err){
    const b=document.createElement("div");
    b.style.cssText="padding:20px;background:#fee;color:#900;direction:rtl";
    b.textContent="خطأ: "+(err&&err.message?err.message:err);
    document.body.prepend(b);
  }
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
</script>
