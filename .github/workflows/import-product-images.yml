name: Import verified product gallery images

on:
  workflow_dispatch:
  push:
    branches:
      - chore/product-image-import-pipeline
    paths:
      - "data/product-image-sources.json"
      - "scripts/import_product_images.py"
      - ".github/workflows/import-product-images.yml"

permissions:
  contents: write

concurrency:
  group: naqa-product-image-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install image processor
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download, validate and convert approved images
        run: python scripts/import_product_images.py
      - name: Commit gallery images
        run: |
          if git diff --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/products data/products.bundle.js
          git commit -m "Add verified gallery images for first 50 products"
          git push origin "HEAD:${{ github.ref_name }}"
