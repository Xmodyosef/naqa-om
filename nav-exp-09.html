<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>تجربة 09 — نقاء وردي — آباء صف + أبناء مقطّع</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f6f0ed;color:#1f1a17;direction:rtl}
.wrap{max-width:980px;margin:0 auto;padding:12px}
.tag{display:inline-block;font-size:.7rem;font-weight:800;color:#8d3048;background:#f3e4e8;padding:4px 10px;border-radius:999px;margin-bottom:10px}
h1{font-size:1.05rem;margin:0 0 6px}
.note{color:#7a6a65;font-size:.82rem;margin:0 0 16px;line-height:1.5}
.demo{background:#fff;border:1px solid #eadfd9;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(40,20,24,.06)}
.main{padding:16px;min-height:220px}
.main h2{margin:0 0 8px;font-size:1rem}
.main p{margin:0;color:#7a6a65;font-size:.85rem;line-height:1.55}
.ph{height:10px;background:#f0e6e2;border-radius:6px;margin:10px 0}
.ph.w2{width:70%}.ph.w3{width:45%}
.card{background:#faf6f4;border:1px solid #eadfd9;border-radius:12px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">تجربة 09 · معاينة فقط · اللوحة الأصلية ما تغيّرت</span>
  <h1>نقاء وردي — آباء صف + أبناء مقطّع</h1>
  <p class="note">هوية نقاء: آباء فوق بخط وردي، أبناء كشريط مقطّع منفصل داخل المحتوى.<br>اضغطي الآباء والأبناء للتجربة. اختاري الرقم اللي يعجبك.</p>
  
<style>
.nav-p{display:flex;gap:0;padding:0 8px;overflow-x:auto;background:#fff;border-bottom:1px solid #eadfd9}
.pbtn{border:0;background:0;padding:14px 18px;font:800 .84rem inherit;color:#8a7a75;cursor:pointer;white-space:nowrap}
.pbtn.on{color:#c46b7c}
.seg-wrap{display:none;padding:12px 16px 0}
.seg-wrap.show{display:block}
.seg{display:inline-flex;background:#f0e6e2;padding:3px;border-radius:12px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:10px;font:800 .74rem inherit;cursor:pointer;color:#6b5c57;white-space:nowrap}
.seg button.on{background:#fff;color:#8d3048;box-shadow:0 1px 4px rgba(0,0,0,.08)}
</style>
<div class="demo">
  <div class="nav-p" id="parents"></div>
  <div class="main">
    <div class="seg-wrap" id="children"><div class="seg" id="seg"></div></div>
    <h2 id="t" style="margin-top:12px">—</h2>
    <p id="dscr"></p>
    <div class="card">محتوى نقاء</div>
  </div>
</div>
<script>
const tabs={home:{l:'الرئيسية'},orders:{l:'الطلبات',c:[['all','الكل'],['new','جديد'],['prep','تجهيز'],['ship','توصيل'],['done','تم'],['cancel','ملغي']]},products:{l:'المنتجات',c:[['all','الكل'],['shown','ظاهر'],['hidden','مخفي']]},reviews:{l:'التقييمات'},customers:{l:'العملاء'},finance:{l:'المالية'},settings:{l:'الإعدادات'}};
let cur='products',sub='all';
const P=document.getElementById('parents'),W=document.getElementById('children'),S=document.getElementById('seg');
function paint(){
  P.innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="pbtn ${k===cur?'on':''}" data-k="${k}">${v.l}</button>`).join('');
  const t=tabs[cur];
  document.getElementById('t').textContent=t.l;
  if(t.c){W.classList.add('show');S.innerHTML=t.c.map(([id,l])=>`<button class="${sub===id?'on':''}" data-s="${id}">${l}</button>`).join('');}
  else{W.classList.remove('show');S.innerHTML='';}
  document.getElementById('dscr').textContent='الأنظف للوحة صغيرة: أب فوق · ابن مقطّع تحت العنوان.';
}
P.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;cur=b.dataset.k;sub=tabs[cur].c?tabs[cur].c[0][0]:null;paint()};
S.onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;sub=b.dataset.s;paint()};
paint();
</script>

  <p class="note" style="margin-top:16px"><a href="nav-experiments.html">← كل التجارب</a></p>
</div>
</body>
</html>
